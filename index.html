<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vorratskammer</title>
<meta name="theme-color" content="#f2f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vorrat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f2f4f1; --surface:#ffffff; --sunk:#e6eae4; --line:#d5dbd2;
  --fg:#18201b; --muted:#5d6a61;
  --accent:#2c6a4c; --accent-fg:#ffffff; --accent-soft:#dcebe2;
  --keller:#3d5a80; --aussen:#7a4a73;
  --warn:#9a5b00; --warn-soft:#f6e7cf; --danger:#b3261e; --empty:#8f9a93;
  --shadow:0 1px 2px rgb(20 30 25 / .06),0 6px 20px rgb(20 30 25 / .08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --font-round:ui-rounded,-apple-system,"SF Pro Rounded",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121714; --surface:#1b221e; --sunk:#232c27; --line:#2f3a33;
  --fg:#e7ede8; --muted:#9aa8a0;
  --accent:#6cc296; --accent-fg:#0d1a13; --accent-soft:#1f3529;
  --keller:#8fb0db; --aussen:#d39ccb; --warn:#e3a54a; --warn-soft:#3a2d17; --danger:#ff8a80; --empty:#66736b;
  --shadow:0 1px 2px rgb(0 0 0 / .3),0 6px 20px rgb(0 0 0 / .35);
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow-x:hidden}
body{color:var(--fg);font:17px/1.4 var(--font);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 4px) 16px calc(170px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:calc(env(safe-area-inset-top,0px) + 10px) 10px;margin-top:calc(-1 * env(safe-area-inset-top,0px) - 4px);display:grid;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:700 1.65rem/1.1 var(--font-round);letter-spacing:-.01em;margin:0}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.dot.off{background:var(--warn)} .dot.sync{background:var(--empty)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:50px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:1.06rem;height:100%}
.search input::-webkit-search-cancel-button{display:none}
.iconbtn{border:0;background:none;color:var(--muted);padding:8px;font-size:1rem;line-height:1}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.tabs button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:.93rem;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tabs .n{font:500 .75rem var(--num);margin-left:4px;opacity:.75}

ul.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;min-height:66px}
.item .txt{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.name{font-weight:600;font-size:1.02rem;overflow-wrap:anywhere;line-height:1.25}
.sub{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px}
.where{display:inline-flex;align-items:center;flex-wrap:wrap;gap:4px 5px;min-width:0}
.where i{width:8px;height:8px;border-radius:2px;display:inline-block}
.where.keller i{background:var(--keller)} .where.aussen i{background:var(--aussen)}
.where b{font:700 .84rem var(--num);color:var(--fg)}
.total{font:700 1.5rem/1 var(--num);min-width:2ch;text-align:right;padding-right:4px}
.out{color:var(--empty);font:600 .74rem var(--font);text-transform:uppercase;letter-spacing:.06em}

.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:1.5rem;line-height:1;font-weight:500;display:grid;place-items:center;padding:0}
.stepper button:active{transform:scale(.94)}
.stepper button.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stepper button:disabled{opacity:.4}
.stepper input{width:3ch;text-align:center;border:0;background:none;font:700 1.4rem var(--num);padding:0}
.stepper input.zero{color:var(--empty)}

.empty{text-align:center;color:var(--muted);padding-block:36px 20px;display:grid;gap:12px;justify-items:center}
.empty strong{color:var(--fg);font:600 1.15rem var(--font-round)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px}
.btn{min-height:54px;border-radius:14px;border:0;font-weight:600;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:10px;padding-inline:18px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{min-height:44px;font-size:.95rem}
.btn:disabled{opacity:.5}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:600;font-size:.95rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.seg.dir button[data-v="in"][aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg.dir button[data-v="out"][aria-pressed="true"]{background:var(--warn);color:#fff}

/* bottom sheets */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgb(0 0 0 / .4);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:92%;overflow:auto;overscroll-behavior:contain}
.sheet h2{font:700 1.3rem/1.2 var(--font-round);margin:0;text-wrap:balance;overflow-wrap:anywhere}
.hint{font-size:.88rem;color:var(--muted)}
.field{display:grid;gap:6px}
.field>label,.label{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.text{height:50px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);font-size:1.05rem;width:100%}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.locline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.locname{font-weight:600;display:flex;align-items:center;gap:8px}
.locname i{width:10px;height:10px;border-radius:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .8rem var(--num);background:var(--sunk);border-radius:8px;padding:4px 8px}
.suggest{display:grid;gap:6px}
.suggest button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px}
.suggest button span:last-child{color:var(--accent);font-weight:600;font-size:.88rem;white-space:nowrap}
.linkbtn{border:0;background:none;color:var(--muted);font-size:.9rem;padding:8px 0;text-decoration:underline;text-underline-offset:3px;justify-self:center}
.linkbtn.danger{color:var(--danger)}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* scanner */
.scanner{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;color:#fff}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .top{position:relative;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 12px;display:grid;gap:8px;background:linear-gradient(rgb(0 0 0 / .7),rgb(0 0 0 / 0))}
.scanner .top .row{display:flex;gap:8px;align-items:center}
.scanner .top .seg{flex:1;background:rgb(255 255 255 / .16)}
.scanner .top .seg button{color:#fff}
.scanner .top .seg button[aria-pressed="true"]{background:#fff;color:#111;box-shadow:none}
.scanner .close{width:46px;height:46px;border-radius:12px;border:0;background:rgb(255 255 255 / .16);color:#fff;font-size:1.3rem;flex:none}
.scanner .aim{position:relative;z-index:1;flex:1;display:grid;place-items:center;pointer-events:none}
.scanner .aim div{width:80%;max-width:420px;aspect-ratio:2.2;border:3px solid rgb(255 255 255 / .9);border-radius:16px;box-shadow:0 0 0 100vmax rgb(0 0 0 / .35)}
.scanner .aim div.hit{border-color:#6cc296}
.scanner .msg{position:absolute;z-index:2;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:16px;font-size:1rem}
.scanner .card{position:relative;z-index:3;margin:0 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--fg);border-radius:18px;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.scanner .card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.scanner .card .big{font:700 2rem/1 var(--num)}
.delta{font:700 .95rem var(--num);color:var(--accent)}
.delta.neg{color:var(--warn)}
.warnbox{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:.92rem}

.grouphead{font:700 .8rem var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 2px 0}
.cathead button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 2px 2px;font:700 1.05rem var(--font-round);text-align:left}
.cathead .cnt{font:500 .8rem var(--num);color:var(--muted);margin-left:auto}
.cathead .chev{color:var(--muted);transition:transform .15s;font-size:1.2rem;line-height:1}
.cathead button[aria-expanded="true"] .chev{transform:rotate(90deg)}
.where.opened{font-style:italic}
.where.opened i{border-radius:50%}
.select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.packsize{display:flex;align-items:center;gap:10px;justify-content:space-between}
.packsize label{font-weight:600}
.text.small{width:7ch;text-align:center}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{color:var(--accent);font-weight:600;font-size:.95rem;cursor:pointer;padding:4px 0}
details.more[open] summary{margin-bottom:10px}
.morebody{display:grid;gap:14px}
.item.none .name{color:var(--muted);font-weight:500}
.pill{font:600 .8rem/1.3 var(--font);white-space:nowrap;color:var(--fg);border:1px dashed var(--muted);border-radius:6px;padding:0 5px;margin-left:3px}
.viewopts{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px 14px}
.viewopts .toggle{font-size:.84rem;gap:6px}
.toggle{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);font-size:.88rem;font-weight:600;padding:2px 0}
.toggle .sw{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-pressed="true"]{color:var(--fg)}
.toggle[aria-pressed="true"] .sw{background:var(--accent)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(14px)}
.loccard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:4px}
.lochead{font-size:1.02rem;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.locbig{font:700 1.7rem/1 var(--num)}
.locbig small{font:500 .9rem var(--font);color:var(--muted);margin-left:6px}
.olist .olabel{font-size:.95rem}
.pill.full{border-style:solid}
.loccard .locline{padding:2px 0}
.loccard .linkbtn{justify-self:start;color:var(--accent);padding:6px 0 2px}
.olist{display:grid;gap:8px;padding-top:4px}
.orow{display:flex;align-items:center;gap:10px}
.orow .seg{flex:1}
.orow .olabel{flex:1;font-size:.95rem}
.fillseg button{padding:8px 2px;font-size:.9rem}
.fillseg .leer{color:var(--danger)}
.bottle{flex:none;width:16px;height:32px;border:2px solid var(--muted);border-radius:5px 5px 6px 6px;position:relative;overflow:hidden}
.bottle span{position:absolute;left:0;right:0;bottom:0;background:var(--accent)}
.sumline{margin-top:4px;font-size:.95rem}
.otherloc{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.92rem;color:var(--fg)}
.otherloc i{flex:none;width:8px;height:8px;border-radius:2px}
.otherloc span:nth-child(2){flex:1;min-width:0}
.otherloc.no{color:var(--muted)}
.otherloc .chev{color:var(--muted);font-size:1.2rem;line-height:1}
.scanner .card .big{text-align:right}
.scanner .card .big small{display:block;font:600 .7rem var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.scanner .card .olist{max-height:34vh;overflow:auto}
.tag{font:600 .68rem var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.seg{flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:12px;font-size:.92rem;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.scanning .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 130px)}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;padding:0}

.login{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 60px) 16px 40px;display:grid;gap:16px}
.login h1{font-size:2rem}
.err{color:var(--danger);font-size:.92rem}
.demo{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:.88rem;margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
